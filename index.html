<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sakura Study</title>
    <meta name="description" content="A personal Japanese reference notebook — grammar, vocabulary, kanji, and more." />

    <!-- ------------------------------------- -->
    <!-- FONT -->
    <!-- ------------------------------------- -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- ------------------------------------- -->
    <!-- STYLES -->
    <!-- ------------------------------------- -->

    <link rel="stylesheet" href="assets/style.css" />

    <!-- ------------------------------------- -->
    <!-- DATA TABLES -->
    <!-- ------------------------------------- -->
    <!-- index.html has no table on it, but jQuery + DataTables are
         loaded here anyway so this <head> is identical across every
         page — one shared template instead of a special case for the
         one page with nothing to sort. script.js's init functions each
         check for their table by id and no-op if it isn't there. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>

  </head>

  <!-- ------------------------------------- -->
  <!-- BODY STARTS -->
  <!-- ------------------------------------- -->

  <body>
    <div class="layout">
      <aside class="sidebar">

        <!-- ------------------------------------- -->
        <!-- SIDEBAR BRAND -->
        <!-- ------------------------------------- -->
        <!-- The only way back to this landing page — it's deliberately
             not one of the alphabetical entries below, since it isn't
             study content itself. -->
        <a class="sidebar-brand" href="index.html">Sakura Study</a>

        <!-- ------------------------------------- -->
        <!-- SIDEBAR SEARCH -->
        <!-- ------------------------------------- -->
        <div class="sidebar-search">
          <input
            type="text"
            id="sidebarSearch"
            placeholder="Search pages…"
            autocomplete="off"
          />
        </div>

        <!-- ------------------------------------- -->
        <!-- SIDEBAR NAVIGATION -->
        <!-- ------------------------------------- -->
        <!-- Pages are grouped by category, one .menu-group per subfolder
             (Vocabulary → /vocabulary/, Grammar → /grammar/, etc.). To add
             a page: drop the file in its category folder, then add a
             matching <a> here (plus a new .menu-group if it's a new
             category) — the search script and layout both work off this
             flat sibling structure, no other markup changes needed.

             Links are relative, not root-absolute — this site has to keep
             working wherever it's hosted (root domain, a subpath, a
             local file), and only relative paths are guaranteed to
             survive that. The cost: every link's ../ count depends on
             the linking page's own folder depth. From root (index.html)
             assets are assets/style.css and pages are
             vocabulary/numbers.html. From one folder deep
             (vocabulary/*.html) it's ../assets/style.css, a same-folder
             page is just numbers.html, and a different category is
             ../grammar/particles.html. One more ../ per extra level of
             nesting — get the depth right when copying this nav to a
             new page.

             This search matches page titles only. Searching inside a
             page's own content is the in-page table search box, not
             this one.

             Example, once /grammar/particles.html exists:
             <div class="menu-group">Grammar</div>
             <a href="grammar/particles.html">Particles</a> -->
        <nav class="menu" id="sidebarMenu">
          <div class="menu-group">Vocabulary</div>
          <a href="vocabulary/numbers.html">Numbers</a>
          <a href="vocabulary/time.html">Time</a>
        </nav>
        <p class="sidebar-empty" id="sidebarEmpty" hidden>No pages match.</p>
      </aside>

      <main class="content">
        <div class="page">
          <h1>Sakura Study</h1>
          <p class="subtitle">A personal Japanese reference notebook</p>

          <p>
            Pick a page from the sidebar to get started — each one is a
            searchable, sortable reference table for a single topic
            (numbers, time, and more as they're added).
          </p>
        </div>
      </main>
    </div>

<!-- ------------------------------------- -->
<!-- SCRIPTS -->
<!-- ------------------------------------- -->

<script src="assets/script.js"></script>

  </body>
  <!-- ------------------------------------- -->
  <!-- BODY ENDED -->
  <!-- ------------------------------------- -->
</html>
